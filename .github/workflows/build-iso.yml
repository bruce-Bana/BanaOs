name: BanaOS ISO build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - 'config/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

concurrency:
  group: banaos-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso curl wget
      - name: Validate scripts and configuration
        run: |
          bash -n build/build-iso.sh
          sh -n config/desktop/xsession
          sh -n config/desktop/banaos-menu
          bash tests/test-config.sh
      - name: Build BanaOS ISO
        run: bash build/build-iso.sh
      - name: Check ISO and boot metadata
        run: |
          test -s dist/BanaOS-0.1.0-x86_64.iso
          test -s dist/BanaOS-0.1.0-x86_64.iso.sha256
          sha256sum --check dist/BanaOS-0.1.0-x86_64.iso.sha256
          grep -qi 'El Torito' dist/boot-report.txt
      - name: Upload ISO and checksums
        uses: actions/upload-artifact@v4
        with:
          name: BanaOS-x86_64-${{ github.sha }}
          path: |
            dist/*.iso
            dist/*.sha256
            dist/build-manifest.txt
            dist/boot-report.txt
          if-no-files-found: error
          retention-days: 30
