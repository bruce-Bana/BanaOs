# BanaOS UEFI boot menu.
if serial --unit=0 --speed=115200; then
  terminal_input console serial
  terminal_output console serial
fi
set timeout=5
set default=0

menuentry "BanaOS 0.1.1 Live (x86_64)" {
  search --no-floppy --file --set=root /boot/vmlinuz64
  linux /boot/vmlinuz64 loglevel=4 cde waitusb=5 console=tty0 console=ttyS0,115200
  initrd /boot/corepure64.gz
}
